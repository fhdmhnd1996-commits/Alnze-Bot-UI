<!DOCTYPE html>
<html dir="rtl">
<body>
    <button onclick="findButtons()" style="padding:20px; background:yellow;">اضغط هنا لاكتشاف أزرار المنصة</button>
    <div id="debug" style="color:white; font-size:12px;"></div>
    
    <iframe id="tradingFrame" src="https://pocketoption.com/en/cabinet/demo-quick-trading/" style="width:100%; height:80vh;"></iframe>

    <script>
        function findButtons() {
            var frame = document.getElementById('tradingFrame');
            var buttons = frame.contentDocument.querySelectorAll('button');
            var result = "";
            buttons.forEach(function(btn) {
                result += "Class: " + btn.className + " | Text: " + btn.innerText + "<br>";
            });
            document.getElementById('debug').innerHTML = result;
        }
    </script>
</body>
</html>
