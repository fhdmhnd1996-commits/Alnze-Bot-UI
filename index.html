<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; padding: 10px; margin: 0; }
        .card { background-color: #262626; padding: 10px; border-radius: 10px; margin-bottom: 10px; }
        select, input { width: 100%; padding: 8px; margin: 5px 0; background: #333; color: white; border: none; border-radius: 5px; }
        .btn-green { background-color: #2e7d32; padding: 12px; text-align: center; border-radius: 5px; margin-top: 5px; }
        .btn-red { background-color: #d32f2f; padding: 12px; text-align: center; border-radius: 5px; margin-top: 5px; }
        /* هذا الجزء لإضافة الشارت */
        iframe { width: 100%; height: 300px; border: none; margin-top: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>إعدادات البوت</h3>
        <select><option>EURUSD_otc</option><option>GBPUSD_otc</option></select>
        <input type="number" placeholder="المبلغ: 10">
        <select><option>نقطة الصفر</option></select>
    </div>

    <div class="btn-green">تفعيل البوت</div>
    <div class="btn-red">إيقاف البوت</div>

    <!-- إضافة الشارت -->
    <iframe src="https://pocketoption.com/en/cabinet/demo-quick-trading/" title="Trading Chart"></iframe>

</body>
</html>
