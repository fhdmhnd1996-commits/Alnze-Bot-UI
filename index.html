<script>
    // هذا السكريبت سيستمع لأي رسالة تأتي من تطبيق Kodular
    window.addEventListener("message", function(event) {
        if (event.data === "click_buy") {
            // هنا نحدد الكلاس أو المعرف الخاص بزر الشراء في المنصة
            // استبدل 'selector-of-buy-button' بالمعرف الحقيقي للزر
            document.querySelector('.buy-button-class').click();
        }
    });
</script>
