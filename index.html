<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 20px; }
        button { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .real-btn { background-color: #2e7d32; color: white; }
        .start-btn { background-color: #1565c0; color: white; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #333; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align:center;">لوحة تحكم Alnze</h2>
        <button class="real-btn">حساب حقيقي (REAL)</button>
        <input type="number" placeholder="المبلغ (مثلاً 100)">
        <select><option>EURUSD_otc</option></select>
        <button class="start-btn" onclick="alert('جاري تفعيل البوت...')">تفعيل البوت</button>
    </div>
</body>
</html>
